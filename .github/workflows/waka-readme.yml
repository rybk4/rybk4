name: WakaTime profile

on:
  workflow_dispatch:
  schedule:
    # 00:00 in Asia/Qyzylorda (UTC+5), on the following local day.
    - cron: '0 19 * * *'
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: wakatime-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check generator
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Generate cards
        env:
          WAKATIME_TOKEN: ${{ secrets.WAKATIME_TOKEN }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: python .github/scripts/wakatime.py
      - name: Commit updated cards
        run: |
          git add assets/wakatime-light.svg assets/wakatime-dark.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update WakaTime activity'
          git push
